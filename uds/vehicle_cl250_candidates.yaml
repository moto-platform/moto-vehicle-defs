  - {obd_pid: 0x5E, did: 0xF45E, name: ENGINE_FUEL_RATE, label: Fuel rate, group: fuel, length: 2,
     factor_num: 1, factor_den: 20, offset: 0, unit: L/h, min: 0, max: 3276.75,
