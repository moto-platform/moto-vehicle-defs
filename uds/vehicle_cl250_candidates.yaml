# Honda CL250: candidate signal catalog (D-066). NOT POLLED.
#
# Every scalar SAE J1979 / ISO 15031-5 mode 0x01 PID that the CL250 ECU *might* serve
# through the UDS 0x22 0xF4xx path its verified DIDs use (uds/vehicle_cl250.yaml; ISO
# 14229-1 maps OBD PID p to DID 0xF400 | p). The formulas are the standard ones, not
# vehicle facts: whether the CL250 supports a PID is unknown until the D-059 discovery
# scan reports its 0x22 0xF4xx support bitmaps on the bike.
#
# Nothing here is sent. codegen emits this file for host consumers only (Python for
# moto-server, Dart for moto-mobile), merged with the polled DIDs of
# uds/vehicle_cl250.yaml into one catalog, so the app and the server can show every
# signal and mark which ones flow. No C target gets it: no node polls a candidate.
#
# A candidate becomes a polled DID only through /signal-change (D-059 item 4, D-066
# item 3): the scan marks it supported, the entry moves to uds/vehicle_cl250.yaml with
# `verified: false`, a poll_period_ms, a stale_after_ms and a priority, and the D-029
# budget stays <= 0.8. This file therefore never carries poll_period_ms, stale_after_ms
# or priority (codegen refuses them).
#
# Entry: obd_pid, did (= 0xF400 | obd_pid), name (UPPER_SNAKE, unique across both
# files), label (short UI text), group, length (1/2/4 data bytes), factor_num,
# factor_den, offset, unit, min, max (raw 0 and raw 2^(8*length)-1 through the formula;
# codegen checks both), description.
# physical = raw * factor_num / factor_den + offset, raw unsigned big-endian.
#
# Not here yet (non-scalar or multi-value, decoded later in their own change): 0x01
# monitor status (MIL, DTC count), 0x03 fuel system status, 0x12/0x13/0x1C/0x1D/0x1E/0x51
# (enum/bitfield), 0x14-0x1B and 0x24-0x2B / 0x34-0x3B (O2 sensors, two values each).

schema_version: 1
decision: D-066
reference: SAE J1979 / ISO 15031-5 mode 0x01 PIDs, over UDS 0x22 as DID 0xF400 | PID (ISO 14229-1)

# UI group and label of the polled DIDs (uds/vehicle_cl250.yaml), so the merged catalog
# carries them for every signal. Keys must match that file's DID names exactly.
polled:
  ENGINE_SPEED: {group: engine, label: Engine speed}
  VEHICLE_SPEED: {group: motion, label: Speed}
  THROTTLE_POS: {group: engine, label: Throttle}
  COOLANT_TEMP: {group: temperature, label: Coolant}
  BATTERY_VOLTAGE: {group: electrical, label: Battery}

groups: [engine, motion, air, fuel, temperature, electrical, torque, diagnostic]

candidates:
  # engine
  - {obd_pid: 0x04, did: 0xF404, name: ENGINE_LOAD, label: Engine load, group: engine, length: 1,
     factor_num: 100, factor_den: 255, offset: 0, unit: "%", min: 0, max: 100,
     description: Calculated engine load.}
  - {obd_pid: 0x0E, did: 0xF40E, name: TIMING_ADVANCE, label: Ignition advance, group: engine, length: 1,
     factor_num: 1, factor_den: 2, offset: -64, unit: deg, min: -64, max: 63.5,
     description: Ignition timing advance before TDC (cylinder 1).}
  - {obd_pid: 0x1F, did: 0xF41F, name: RUN_TIME_SINCE_START, label: Run time, group: engine, length: 2,
     factor_num: 1, factor_den: 1, offset: 0, unit: s, min: 0, max: 65535,
     description: Run time since engine start.}
  - {obd_pid: 0x43, did: 0xF443, name: ABSOLUTE_LOAD, label: Absolute load, group: engine, length: 2,
     factor_num: 100, factor_den: 255, offset: 0, unit: "%", min: 0, max: 25700,
     description: Absolute load value.}
  - {obd_pid: 0x45, did: 0xF445, name: RELATIVE_THROTTLE_POS, label: Relative throttle, group: engine, length: 1,
     factor_num: 100, factor_den: 255, offset: 0, unit: "%", min: 0, max: 100,
     description: Relative throttle position.}
  - {obd_pid: 0x47, did: 0xF447, name: ABSOLUTE_THROTTLE_POS_B, label: Throttle B, group: engine, length: 1,
     factor_num: 100, factor_den: 255, offset: 0, unit: "%", min: 0, max: 100,
     description: Absolute throttle position B.}
  - {obd_pid: 0x49, did: 0xF449, name: ACCEL_PEDAL_POS_D, label: Throttle grip D, group: engine, length: 1,
     factor_num: 100, factor_den: 255, offset: 0, unit: "%", min: 0, max: 100,
     description: Accelerator pedal (throttle grip) position D.}
  - {obd_pid: 0x4C, did: 0xF44C, name: COMMANDED_THROTTLE, label: Commanded throttle, group: engine, length: 1,
     factor_num: 100, factor_den: 255, offset: 0, unit: "%", min: 0, max: 100,
     description: Commanded throttle actuator.}
  - {obd_pid: 0x5A, did: 0xF45A, name: RELATIVE_ACCEL_PEDAL_POS, label: Relative grip, group: engine, length: 1,
     factor_num: 100, factor_den: 255, offset: 0, unit: "%", min: 0, max: 100,
     description: Relative accelerator pedal (throttle grip) position.}
  # air
  - {obd_pid: 0x0B, did: 0xF40B, name: INTAKE_MAP, label: Intake MAP, group: air, length: 1,
     factor_num: 1, factor_den: 1, offset: 0, unit: kPa, min: 0, max: 255,
