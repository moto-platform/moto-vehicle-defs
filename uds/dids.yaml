# UDS servers of OUR platform nodes: addressing, timing, services, DIDs and DTCs
# (UDS on the platform bus, 0x700-0x7FF: physical 0x7N0 / 0x7N8 with N = NodeId,
# functional 0x7DF; ARCHITECTURE section 4). Protocol codes come from uds/iso14229.yaml.
# The vehicle ECU is defined in uds/vehicle_cl250.yaml and is never written to; nothing
# here is ever sent on the vehicle bus (D-020, D-037).
#
# A node without a `server` section has no UDS server yet. Entry formats:
#   dids:  - did: 0xF189       # 0xF1xx ISO identification, 0xFDxx platform-specific
#            name: SW_VERSION
#            length: 12         # bytes of the data record (fixed)
#            encoding: ascii    # ascii | uint | bitfield | vehicle_sample | record
#            access: read       # read-only unless the user approves otherwise
#            description: ...
#   bitfield fields are {byte, mask}; record fields are {byte, mask} or {byte, length}
#   (unsigned big-endian, 1/2/4 bytes, saturating at their maximum, never wrapping), and
#   every byte of a record belongs to a field.
#   dtcs:  - dtc: 0xC10000      # 3-byte DTC (ISO 14229-1 Annex D), J2012 code in `code`
#            name: ...
#            code: U0100-00
#            description: ...   # when the test fails
#
# UDS frames are not DBC messages: these IDs never appear in dbc/platform.dbc
# (codegen ID plan, range 0x700-0x7FF allowed_in_dbc = false).

schema_version: 1

# Platform-bus ISO-TP (ISO 15765-2) parameters shared by every platform UDS link.
# Platform choices (D-040), not measured vehicle facts.
transport:
  frame_dlc: 8
  padding_byte: 0xAA              # same padding as the vehicle link
  block_size: 0                   # BS we advertise: no further FC after the first
  st_min_ms: 0                    # STmin we advertise
  n_bs_ms: 1000                   # ISO 15765-2 defaults
  n_cr_ms: 1000
  functional_request_id: 0x7DF    # every platform server listens here (Single Frame only)

nodes:
  RT_CORE:
    server:
      physical_request_id: 0x710  # 0x700 + NodeId 1 * 0x10
      physical_response_id: 0x718 # request + 8
      # ISO 14229-2 default server timing (D-040). Reported in the 0x50 response.
      p2_server_max_ms: 50        # first response (or NRC 0x78) after a request
      p2_star_server_max_ms: 5000 # after each NRC 0x78
      s3_server_ms: 5000          # non-default session falls back without a request
      max_read_dids: 4            # DIDs per 0x22 request; more -> NRC 0x13
      rx_buffer: 64               # longest request accepted; longer -> ISO-TP FC.OVFLW
      # Sessions served by 0x10. PROGRAMMING gets NRC 0x12 until the bootloader (Ç5).
      sessions: [DEFAULT, EXTENDED]
      # Services and the sessions they run in. Anything else: NRC 0x11 (0x7F if the
      # service is listed but not in the active session).
      services:
        - {service: DIAGNOSTIC_SESSION_CONTROL, sessions: [DEFAULT, EXTENDED]}
        - {service: TESTER_PRESENT, sessions: [DEFAULT, EXTENDED], subfunctions: [ZERO_SUBFUNCTION]}
        - {service: READ_DATA_BY_IDENTIFIER, sessions: [DEFAULT, EXTENDED]}
        - service: READ_DTC_INFORMATION
          sessions: [DEFAULT, EXTENDED]
          subfunctions: [REPORT_NUMBER_OF_DTC_BY_STATUS_MASK, REPORT_DTC_BY_STATUS_MASK, REPORT_SUPPORTED_DTC]
        # Clears rt-core's own DTC records only (never the vehicle ECU, never the UDS
        # client latch). Extended session only: there is no 0x27 yet (D-040).
        - {service: CLEAR_DIAGNOSTIC_INFORMATION, sessions: [EXTENDED]}
      # DTC memory is RAM only until the H7 flash driver exists (lost on reset, D-040).
      dtc_status_availability_mask: 0x09   # TEST_FAILED | CONFIRMED_DTC
    dids:
      - did: 0xF186
        name: ACTIVE_DIAGNOSTIC_SESSION
        length: 1
        encoding: uint
        access: read
        description: Active diagnostic session (ISO 14229-1 C.1), 0x01 default or 0x03 extended.
      - did: 0xF189
        name: SW_VERSION
        length: 12
        encoding: ascii
        access: read
        description: Application software version "MAJOR.MINOR.PATCH" from the build (CMake project VERSION), NUL-padded.
      - did: 0xFD00
        name: VEHICLE_TESTER_STATUS
        length: 2
        encoding: bitfield
        access: read
        description: State of rt-core's vehicle-bus UDS client (the single tester, D-021).
        # Fail-safe (D-040): a status older than this, or none since boot, reads as
        # FAULT = NOT_RUNNING with every bit clear, and VEHICLE_TESTER_LATCHED fails.
        max_age_ms: 500
        fields:
          - {byte: 0, mask: 0x01, name: ECU_PRESENT, description: The CL250 ECU answered within ecu_absent_timeout_ms.}
          - {byte: 0, mask: 0x02, name: SESSION_UP, description: The extended session with the ECU is established.}
          - {byte: 0, mask: 0x04, name: LATCHED, description: The client latched fail-closed and sends nothing (D-039).}
          - {byte: 1, mask: 0xFF, name: FAULT, description: "Latch reason, see values."}
        values:
          FAULT: {NONE: 0, GATE: 1, GUARD: 2, FOREIGN_TESTER: 3, NOT_RUNNING: 4}
      - did: 0xFD01
        name: UPTIME
        length: 4
        encoding: uint
        unit: s
        access: read
        description: Seconds since boot, unsigned big-endian (wraps after about 49.7 days).
      # Samples of the CL250 DIDs in services/vehicle_signals. Layout:
      # [state][age_ms hi][age_ms lo][raw, `length` of the vehicle DID, big-endian].
      # state 0 NONE / 1 VALID / 2 STALE; age saturates at 0xFFFF and is 0xFFFF for NONE.
      - {did: 0xFD10, name: VEHICLE_ENGINE_SPEED, encoding: vehicle_sample, vehicle_did: ENGINE_SPEED,
         access: read, description: Last CL250 engine speed sample.}
      - {did: 0xFD11, name: VEHICLE_VEHICLE_SPEED, encoding: vehicle_sample, vehicle_did: VEHICLE_SPEED,
         access: read, description: Last CL250 vehicle speed sample.}
      - {did: 0xFD12, name: VEHICLE_THROTTLE_POS, encoding: vehicle_sample, vehicle_did: THROTTLE_POS,
         access: read, description: Last CL250 throttle position sample.}
      - {did: 0xFD13, name: VEHICLE_COOLANT_TEMP, encoding: vehicle_sample, vehicle_did: COOLANT_TEMP,
         access: read, description: Last CL250 coolant temperature sample.}
      - {did: 0xFD14, name: VEHICLE_BATTERY_VOLTAGE, encoding: vehicle_sample, vehicle_did: BATTERY_VOLTAGE,
         access: read, description: Last CL250 control module voltage sample.}
      # rt-core health (D-054 item 8, D-055): the D-053 step counters of the vehicle UDS
      # client and, per CAN port, the state machine of services/can_sm. Appended last so
      # the existing platform_uds_did_index_t values stay unchanged.
      - did: 0xFD02
        name: RT_CORE_HEALTH
        length: 23
        encoding: record
        access: read
        description: rt-core health. Step counters of the vehicle UDS client (D-053) and, per CAN port, state, bus-offs, recovery attempts, deferred recoveries and N_As aborts since boot (D-054). Counters saturate, never wrap.
        # The step counters older than this (or none since boot) read as their last values
        # with STEP_STATS_FRESH clear (the client is not running). The CAN fields are read
        # from services/can_sm at the time of the request.
        max_age_ms: 500
        fields:
          - {byte: 0, mask: 0x01, name: STEP_STATS_FRESH, description: The step counters were written by the running vehicle UDS client within max_age_ms.}
          - {byte: 0, mask: 0x02, name: VEHICLE_LATCHED, description: "The vehicle port latched after its bus-off limit and stays off the vehicle bus until reboot (D-030, D-054); same as VEHICLE_STATE LATCHED."}
          - {byte: 1, length: 2, name: STEP_OVERRUNS, description: Poll gaps above client_step_max_ms since boot (D-053).}
          - {byte: 3, length: 2, name: STEP_GAP_MAX_MS, description: Longest gap between two client polls since boot in ms (D-053).}
          - {byte: 5, length: 1, name: VEHICLE_STATE, description: "State of the vehicle CAN port, see values."}
          - {byte: 6, length: 2, name: VEHICLE_BUS_OFFS, description: Bus-off events of the vehicle port since boot.}
          - {byte: 8, length: 2, name: VEHICLE_RECOVERIES, description: Bus-off recovery attempts of the vehicle port since boot.}
          - {byte: 10, length: 2, name: VEHICLE_RECOVER_DEFERRED, description: Steps a due recovery of the vehicle port waited for a pending frame's abort.}
          - {byte: 12, length: 2, name: VEHICLE_NAS_ABORTS, description: TX aborts of the vehicle port after N_As without a TX confirmation.}
          - {byte: 14, length: 1, name: PLATFORM_STATE, description: "State of the platform CAN port, see values (never LATCHED, D-054)."}
          - {byte: 15, length: 2, name: PLATFORM_BUS_OFFS, description: Bus-off events of the platform port since boot.}
          - {byte: 17, length: 2, name: PLATFORM_RECOVERIES, description: Bus-off recovery attempts of the platform port since boot.}
          - {byte: 19, length: 2, name: PLATFORM_RECOVER_DEFERRED, description: Steps a due recovery of the platform port waited for a pending frame's abort.}
          - {byte: 21, length: 2, name: PLATFORM_NAS_ABORTS, description: TX aborts of the platform port after N_As without a TX confirmation.}
        values:
          VEHICLE_STATE: {ERROR_ACTIVE: 0, ERROR_PASSIVE: 1, BUS_OFF: 2, LATCHED: 3}
          PLATFORM_STATE: {ERROR_ACTIVE: 0, ERROR_PASSIVE: 1, BUS_OFF: 2, LATCHED: 3}
    dtcs:
      - dtc: 0xC10000
        name: VEHICLE_ECU_COMM_LOST
        code: U0100-00
        description: The CL250 engine ECU gave no answer within ecu_absent_timeout_ms.
      - dtc: 0xF00000
        name: VEHICLE_TESTER_LATCHED
        code: U3000-00
        description: The vehicle UDS client latched fail-closed (gate, guard or foreign tester, D-039), or it is not running (no status within max_age_ms of 0xFD00). Clearing the DTC does not release the latch.
      # SAE J2012 U0001 (high speed CAN communication bus) with failure type 0x88 (bus off).
      - dtc: 0xC00188
        name: VEHICLE_BUS_OFF_LATCHED
        code: U0001-88
        description: rt-core's vehicle CAN port latched after its bus-off limit since boot and stays off the vehicle bus until reboot (D-030, D-054, D-055). Fails while the latch holds; clearing the DTC does not release the latch.
    routines: []
  SAFETY:
    dids: []
    dtcs: []
    routines: []
  IO:
    dids: []
    dtcs: []
    routines: []
  CONN:
    dids: []
    dtcs: []
    routines: []
  LINUX:
    dids: []
    dtcs: []
    routines: []
