# Honda CL250 engine ECU: UDS polling definition for the single vehicle-bus tester
# (rt-core, D-021; connectivity-node until rt-core exists, D-023).
#
# Every value here is extracted from the legacy firmware whose CAN/UDS path was
# validated on the real motorcycle (D-019). Evidence is "<path>:<line(s)>" inside
# `source.repo` at `source.commit`. Human notes: docs/legacy-telemetry-notes.md.
# Nothing here may cause a write to the ECU: the requests are checked against
# `tester_policy` (D-020) by tools/codegen, and generated code enforces it again.

schema_version: 1
vehicle: Honda CL250
ecu: CL250_ECU

source:
  repo: moto-platform/HondaCl250_Telemetry
  commit: 16a4b26
  status: archived, read-only (D-022)

bus:
  type: classic_can
  bitrate: 500000
  verified: true
  evidence:
    - src/hal/TwaiCanBus.cpp:7
    - CONTEXT.md:20

addressing:
  primary:
    id_type: extended_29bit
    scheme: normal_fixed          # ISO 15765-4: 0x18DA<TA><SA>
    request_id: 0x18DA10F1
    response_id: 0x18DAF110
    ecu_address: 0x10
    tester_address: 0xF1
    verified: true
    evidence:
      - src/HondaCANModule.cpp:3-6
      - src/HondaCANModule.h:21
      - CONTEXT.md:47-48
  fallback:
    id_type: standard_11bit
    request_id: 0x7E0
    response_id: 0x7E8
    # The legacy code sends every request on both IDs and accepts either response.
    # Which of the two the CL250 ECU actually answers was not recorded.
    verified: false
    evidence:
      - src/HondaCANModule.cpp:8-9
      - src/HondaCANModule.h:22
      - src/HondaCANModule.cpp:99-103
  # Q-021 -> D-040: OBD functional request IDs (ISO 15765-4), WATCH-ONLY. The tester
  # never sends on them (the can_if guard passes request_id only). A frame seen on one
  # of them means a second tester such as a generic OBD dongle (D-021), and rt-core's
  # client latches fail-closed (D-039). Standard values, not taken from the legacy code.
  functional_watch:
    watch_only: true
    ids:
      - {id_type: standard_11bit, id: 0x7DF}
      - {id_type: extended_29bit, id: 0x18DB33F1}
    verified: false
    reference: ISO 15765-4 functional addressing

transport:
  protocol: iso15765_2
  frame_dlc: 8
  padding_byte: 0xAA
  # All DIDs below fit in a Single Frame. Legacy code drops any other PCI type;
  # a First Frame's byte 1 is part of the length, not a SID (ISO-TP pitfall).
  single_frame_only_in_legacy: true
  evidence:
    - src/HondaCANModule.cpp:52-64
    - src/HondaCANModule.cpp:222-239
  # D-059 (Q-020): the one Flow Control frame the tester may send, so that it can
  # receive a segmented answer (VIN, DTC list) to an allowed request. Requests stay
  # Single Frame. The frame gate passes exactly this frame, byte for byte:
  # [0x30 | flow_status, block_size, STmin, padding x5], 8 bytes. Any other FC (WAIT,
  # OVFLW, another BS/STmin/padding), a First or a Consecutive Frame stays refused.
  # The gate is stateless: the client sends it only while it receives the answer to
  # its own allowed request, and only for a First Frame with FF_DL <= max_ff_dl
  # (anything longer gets no FC; the ECU then times out on N_Bs). After a First Frame
  # it did not answer with an FC, the client sends no request for
  # response_timeout_max_ms and does not count it as a DID timeout; a reception whose
  # next CF does not arrive within response_timeout_base_ms (N_Cr), whose sequence
  # number skips, or during which the receiver lost a frame, is aborted. Platform
  # choices, not legacy values: the golden copy in tools/codegen config.py bounds them.
  flow_control:
    decision: D-059
    flow_status: 0x0          # ContinueToSend only; WAIT and OVFLW are never sent
    block_size: 0             # one FC per reception: the ECU sends every CF after it
    # 0 = no gap between CFs, as our own servers advertise (uds/dids.yaml). The
    # receiver must therefore hold a burst of ceil((max_ff_dl - 6) / 7) CFs
    # (generated as VEHICLE_CL250_FC_MAX_CF_BURST, 36 here; about 10 ms at 500 kbps).
    st_min_ms: 0
    padding_byte: 0xAA        # same as padding_byte above; the FC is always 8 bytes
    max_ff_dl: 255            # largest segmented answer the client accepts (bytes)

# D-020: the only services the vehicle-bus tester may ever send. Sub-function
# checks ignore bit 7 (suppressPosRspMsgIndicationBit).
tester_policy:
  decision: D-020
  allowed:
    - {sid: 0x10, name: DiagnosticSessionControl, subfunctions: [0x01, 0x03]}
    - {sid: 0x3E, name: TesterPresent, subfunctions: [0x00]}
    - {sid: 0x22, name: ReadDataByIdentifier}
    - {sid: 0x19, name: ReadDTCInformation}
    - {sid: 0x01, name: OBD show current data}
    - {sid: 0x09, name: OBD request vehicle information}
  forbidden: [0x11, 0x14, 0x27, 0x2E, 0x2F, 0x31, 0x34, 0x36, 0x37]
  forbidden_subfunctions:
    - {sid: 0x10, subfunctions: [0x02]}

# D-059: one-shot discovery scan (conn's `esp32-s3-devkitc-1-probe` env), run once
# after the listen window and the session start, one request in flight, with the
# timeouts above. Standard requests (SAE J1979 / ISO 15031-5, ISO 14229-1), not
# vehicle signals; what they find enters this file only through /signal-change with
# `verified: false`. codegen checks every request against tester_policy and the frame
# gate (as a padded Single Frame) and generates the table in table order. Some ECUs
# answer OBD 0x01/0x09 only in the default session: the probe may retry them after
# 0x10 0x01 (allowed by tester_policy).
# - bitmap: true = the positive response carries a 4-byte support bitmap right after
#   the echo of the request (offset = request length): bit 7 of its first byte is
#   id base+1, bit 0 of its last byte is id base+0x20, base = the last request byte.
# - after: {name, id} = send only if the bitmap answer of entry `name` (earlier in
#   the list) marks `id` supported. The next bitmap of a chain is gated by the last
#   bit of the previous one.
discovery_scan:
  decision: D-059
  requests:
    # OBD mode 0x01: supported PIDs 0x01-0xFF.
    - {name: OBD_PIDS_01_20, request: [0x01, 0x00], bitmap: true}
    - {name: OBD_PIDS_21_40, request: [0x01, 0x20], bitmap: true, after: {name: OBD_PIDS_01_20, id: 0x20}}
    - {name: OBD_PIDS_41_60, request: [0x01, 0x40], bitmap: true, after: {name: OBD_PIDS_21_40, id: 0x40}}
    - {name: OBD_PIDS_61_80, request: [0x01, 0x60], bitmap: true, after: {name: OBD_PIDS_41_60, id: 0x60}}
    - {name: OBD_PIDS_81_A0, request: [0x01, 0x80], bitmap: true, after: {name: OBD_PIDS_61_80, id: 0x80}}
    - {name: OBD_PIDS_A1_C0, request: [0x01, 0xA0], bitmap: true, after: {name: OBD_PIDS_81_A0, id: 0xA0}}
    - {name: OBD_PIDS_C1_E0, request: [0x01, 0xC0], bitmap: true, after: {name: OBD_PIDS_A1_C0, id: 0xC0}}
    - {name: OBD_PIDS_E1_FF, request: [0x01, 0xE0], bitmap: true, after: {name: OBD_PIDS_C1_E0, id: 0xE0}}
    # OBD mode 0x09: supported infotypes, then the ones with a fixed meaning on CAN.
    - {name: OBD_INFOTYPES_01_20, request: [0x09, 0x00], bitmap: true}
    - {name: OBD_VIN, request: [0x09, 0x02], after: {name: OBD_INFOTYPES_01_20, id: 0x02}}
    - {name: OBD_CALID, request: [0x09, 0x04], after: {name: OBD_INFOTYPES_01_20, id: 0x04}}
    - {name: OBD_CVN, request: [0x09, 0x06], after: {name: OBD_INFOTYPES_01_20, id: 0x06}}
    - {name: OBD_IPT, request: [0x09, 0x08], after: {name: OBD_INFOTYPES_01_20, id: 0x08}}
    - {name: OBD_ECU_NAME, request: [0x09, 0x0A], after: {name: OBD_INFOTYPES_01_20, id: 0x0A}}
    # UDS 0x19: DTC count and DTCs, every status bit.
    - {name: DTC_COUNT, request: [0x19, 0x01, 0xFF]}
    - {name: DTC_LIST, request: [0x19, 0x02, 0xFF]}
    # UDS 0x22: the 0xF4xx support DIDs (OBD PIDs over UDS), a cross-check of the
    # 0x22 path the poller uses.
    - {name: DID_F401_F420, request: [0x22, 0xF4, 0x00], bitmap: true}
    - {name: DID_F421_F440, request: [0x22, 0xF4, 0x20], bitmap: true, after: {name: DID_F401_F420, id: 0x20}}
    - {name: DID_F441_F460, request: [0x22, 0xF4, 0x40], bitmap: true, after: {name: DID_F421_F440, id: 0x40}}
    - {name: DID_F461_F480, request: [0x22, 0xF4, 0x60], bitmap: true, after: {name: DID_F441_F460, id: 0x60}}
    - {name: DID_F481_F4A0, request: [0x22, 0xF4, 0x80], bitmap: true, after: {name: DID_F461_F480, id: 0x80}}
    - {name: DID_F4A1_F4C0, request: [0x22, 0xF4, 0xA0], bitmap: true, after: {name: DID_F481_F4A0, id: 0xA0}}
    - {name: DID_F4C1_F4E0, request: [0x22, 0xF4, 0xC0], bitmap: true, after: {name: DID_F4A1_F4C0, id: 0xC0}}
    - {name: DID_F4E1_F4FF, request: [0x22, 0xF4, 0xE0], bitmap: true, after: {name: DID_F4C1_F4E0, id: 0xE0}}

session:
  start:
    request: [0x10, 0x03]            # UDS payload (without ISO-TP PCI)
    positive_response_sid: 0x50
    retry_interval_ms: 2000          # retried until a positive 0x50 is seen
    verified: true
    evidence:
      - src/HondaCANModule.cpp:37-42
      - src/HondaCANModule.cpp:151-158
      - src/HondaCANModule.cpp:276-282
      - src/HondaCANModule.h:103-105
  tester_present:
    request: [0x3E, 0x80]            # zeroSubFunction, positive response suppressed
    period_ms: 1000
    verified: true
    evidence:
      - src/HondaCANModule.cpp:143-149
      - CONTEXT.md:52

timing:
  requests_in_flight: 1              # strict single-request state machine
  response_timeout_base_ms: 100
  response_timeout_max_ms: 2000      # NRC 0x78 resets and doubles the timeout up to this
  max_consecutive_timeouts: 5
  did_skip_cooldown_ms: 5000         # DID skipped this long after max_consecutive_timeouts
  ecu_absent_timeout_ms: 3000        # ECU "present" if any positive response or NRC within this
  bus_off_backoff_initial_ms: 1000   # recovery attempts back off exponentially
  bus_off_backoff_max_ms: 30000
  # PROVISIONAL (D-029), not measured: round-trip time assumed for the polling
  # budget check; sum(assumed_round_trip_ms / poll_period_ms) must stay <= 0.8.
  assumed_round_trip_ms: 20
  # PROVISIONAL (D-029, D-053), not measured: the largest difference between the
  # timebase readings (ms ticks, rounded up) of two consecutive runs of the tester's
  # step on the target, period + release jitter. The tester sees an answer, and a
  # timeout, only at its next step, so every poll_period_ms must be at least
  # response_timeout_base_ms + client_step_max_ms, and a faulty read holds the slot up
  # to their sum (D-053, ISSUES E-9). Must stay below assumed_round_trip_ms, which
  # includes one step. A runtime check of the real step gaps belongs to the tester.
  client_step_max_ms: 10
  verified: true
  evidence:
    - src/HondaCANModule.h:34-41
    - src/HondaCANModule.h:59-92
    - src/HondaCANModule.h:107-109
    - src/HondaCANModule.cpp:105-141
    - src/HondaCANModule.cpp:195-214
    - src/HondaCANModule.cpp:283-309

# Response layout (Single Frame): [PCI=0x0N][0x62][DID_hi][DID_lo][A][B]...
# raw = data bytes as unsigned big-endian; physical = raw * factor_num / factor_den + offset.
# priority (D-043): high | normal. Among the DIDs that are due, the tester serves
# every `high` one before any `normal` one; list order is only the tie-break
# inside a class and the index of the generated table. Priority changes the order
# only, never the content: tester_policy and the D-020 gates are unchanged, and
# every due DID is still served within its stale_after_ms (no starvation: codegen
# bounds each DID's worst-case sample gap for this order by its stale_after_ms, and
# the polling budget below stays <= 0.8). While a DID is faulty (D-050, D-051) it
# competes as normal and holds the slot for up to response_timeout_base_ms per read;
# codegen also bounds the others' request gaps with any one DID faulty (D-052).
# poll_period_ms >= response_timeout_base_ms + client_step_max_ms for every DID
# (D-052, D-053): a read answered within the base timeout without NRC 0x78 is seen
# by the tester, at most one step later, before the DID is due again, so the DIDs due
# meanwhile go first; unless an earlier timed-out read stamps it, it is in time.
# poll_period_verified: false = provisional platform value (D-029) that differs from
# the verified legacy period (legacy_poll_period_ms); to be confirmed by the
# measurement system. The DID itself and its formula stay verified.
# stale_after_ms is a PLATFORM choice (3 x poll period, D-025), not a legacy value:
# a sample older than this must not be used or republished as VALID (exception:
# VEHICLE_SPEED keeps the 300 ms speed age of D-048, D-053). The legacy
# code used one 500 ms threshold for everything (src/SystemState.h:10).
dids:
  - did: 0xF40C
    name: ENGINE_SPEED
    description: Engine speed (SAE J1979 PID 0x0C).
    obd_pid: 0x0C
    length: 2
    formula: (A*256+B)/4
    factor_num: 1
    factor_den: 4
    offset: 0
    unit: rpm
    min: 0
    max: 16383.75
    # 110 ms, not the legacy 50 ms: a period below the base timeout let a slow answer
    # within it starve the later normal DIDs (D-052, ISSUES E-8), and one step more is
    # needed for an answer the tester sees after the base timeout (D-053, ISSUES E-9).
    poll_period_ms: 110
    poll_period_verified: false
    legacy_poll_period_ms: 50
    stale_after_ms: 330
    priority: normal
    platform_signal: VehicleEngine.ENGINE_SPEED
    verified: true
    evidence:
      - src/HondaCANModule.h:76
      - src/HondaCANModule.cpp:244-247

  - did: 0xF40D
    name: VEHICLE_SPEED
    description: Vehicle speed (SAE J1979 PID 0x0D).
    obd_pid: 0x0D
    length: 1
    formula: A
    factor_num: 1
    factor_den: 1
    offset: 0
    unit: km/h
    min: 0
    max: 255
    # 110 ms = response_timeout_base_ms + client_step_max_ms (D-053, ISSUES E-9).
    poll_period_ms: 110
    poll_period_verified: false
    legacy_poll_period_ms: 800
    # 300 ms, not 3 x 110: the speed age of D-048 (platform_limits
    # vehicle_speed_max_age_ms), kept by D-053.
    stale_after_ms: 300
    # high: feeds rt-core's EKF lean estimate (Layer 2), which is a Layer 1
    # input. A quality measure, not a safety claim: not a safety-node input (D-041).
    priority: high
    platform_signal: VehicleSpeed.VEHICLE_SPEED
    verified: true
    evidence:
      - src/HondaCANModule.h:77
      - src/HondaCANModule.cpp:248-251

  - did: 0xF411
    name: THROTTLE_POS
    description: Absolute throttle position (SAE J1979 PID 0x11).
    obd_pid: 0x11
    length: 1
    formula: A*100/255
    factor_num: 100
    factor_den: 255
    offset: 0
    unit: "%"
    min: 0
    max: 100
    poll_period_ms: 200
    poll_period_verified: false
    legacy_poll_period_ms: 800
    stale_after_ms: 600
    priority: normal
    platform_signal: VehicleEngine.THROTTLE_POS
    verified: true
    evidence:
      - src/HondaCANModule.h:78
      - src/HondaCANModule.cpp:256-259

  - did: 0xF405
    name: COOLANT_TEMP
    description: Engine coolant temperature (SAE J1979 PID 0x05).
    obd_pid: 0x05
    length: 1
    formula: A-40
    factor_num: 1
    factor_den: 1
    offset: -40
    unit: degC
    min: -40
    max: 215
    poll_period_ms: 800
    stale_after_ms: 2400
    priority: normal
    platform_signal: VehicleEngine.COOLANT_TEMP
    verified: true
    evidence:
      - src/HondaCANModule.h:79
      - src/HondaCANModule.cpp:252-255

  - did: 0xF442
    name: BATTERY_VOLTAGE
    description: Control module voltage (SAE J1979 PID 0x42).
    obd_pid: 0x42
    length: 2
    formula: (A*256+B)/1000
    factor_num: 1
    factor_den: 1000
    offset: 0
    unit: V
    min: 0
    max: 65.535
    poll_period_ms: 800
    stale_after_ms: 2400
    priority: normal
    platform_signal: VehicleEngine.BATTERY_VOLTAGE
    verified: true
    # The legacy decoder also has an A/10 heuristic for short/small responses;
    # it is not carried over (see docs/legacy-telemetry-notes.md).
    evidence:
      - src/HondaCANModule.h:80
      - src/HondaCANModule.cpp:260-268
      - CONTEXT.md:59
