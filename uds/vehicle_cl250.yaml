  - did: 0xF44C
    name: COMMANDED_THROTTLE
    description: Commanded throttle actuator (SAE J1979 PID 0x4C).
    obd_pid: 0x4C
    length: 1
    formula: A*100/255
    factor_num: 100
    factor_den: 255
    offset: 0
    unit: "%"
    min: 0
    max: 100
