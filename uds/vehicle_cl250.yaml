  - did: 0xF40B
    name: INTAKE_MAP
    description: Intake manifold absolute pressure (SAE J1979 PID 0x0B).
    obd_pid: 0x0B
    length: 1
    formula: A
    factor_num: 1
    factor_den: 1
    offset: 0
    unit: kPa
    min: 0
