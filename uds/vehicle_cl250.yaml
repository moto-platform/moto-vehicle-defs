  - did: 0xF45A
    name: RELATIVE_ACCEL_PEDAL_POS
    description: Relative accelerator pedal (throttle grip) position (SAE J1979 PID 0x5A).
    obd_pid: 0x5A
    length: 1
    formula: A*100/255
    factor_num: 100
