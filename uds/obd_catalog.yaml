# Vehicle-independent OBD / UDS catalog (D-066, D-068, D-078 item 2). NOT POLLED.
#
# The standard SAE J1979 / ISO 15031-5 mode 0x01 PIDs, read over UDS 0x22 0xF4xx (ISO
# 14229-1 maps OBD PID p to DID 0xF400 | p), and the ISO 14229-1 Annex C identification
# DIDs. The formulas are the standard ones, not vehicle facts: whether a vehicle serves a
# PID is unknown until its discovery scan (D-059) reports the 0x22 0xF4xx support bitmaps.
# A vehicle's poll list (uds/vehicle_cl250.yaml today) polls a subset of this catalog;
# the rest is defined here but never sent.
#
# Nothing here is sent. codegen emits this file for host consumers only (Python for
# vehicle-server, Dart for vehicle-mobile), merged with the polled DIDs of the vehicle's poll
# list into one catalog, so the app and the server can show every signal and mark which
# ones flow. No C target gets it: no node polls a catalog entry.
#
# An entry becomes polled on a vehicle only through /signal-change (D-066, D-078 item 2):
# it moves to the vehicle's poll list with `verified: false`, a poll_period_ms, a
# stale_after_ms and priority normal, at the end of the table, and the D-029 budget stays
# <= 0.8. This file therefore never carries poll_period_ms, stale_after_ms or priority
# (codegen refuses them). Only a scalar entry can be moved: the tester decodes one number
# per DID, so a multi-value entry (`fields`) stays a host-side definition.
#
# Entry: obd_pid, did (= 0xF400 | obd_pid), name (UPPER_SNAKE, unique across the catalog
# and the poll list), label (short UI text), group, length (1/2/4 data bytes),
# description, and either
#   scalar:      factor_num, factor_den, offset, unit, min, max (raw 0 and raw
#                2^(8*length)-1 through the formula; codegen checks both).
#                physical = raw * factor_num / factor_den + offset, raw unsigned big-endian.
#   multi-value: `fields`, for PIDs whose answer carries several values. The entry has no
#                top-level factor_num/factor_den/offset/unit/min/max; `length` stays.
# Field: name (UPPER_SNAKE, unique in the entry), byte (0 = A), either `size` (whole
# bytes, big-endian unsigned) or `bit` + `bits` (inside that one byte, bit 0 = LSB), then
# factor_num, factor_den, offset, unit ("" = raw), min, max (as for a scalar, with raw
# 2^bits-1 or 2^(8*size)-1 as the top), and optionally
#   enum:         {raw value: NAME}; keys inside the field's raw range, names unique.
#                 The decoder returns the name (the raw value if it is not listed).
#   not_used_raw: a raw value that means "not used" (the decoder returns None).
# Fields lie inside `length` and never share a bit. Generated: decode_fields() in
# gen/python/vehicle_defs/vehicle_catalog.py and the Dart equivalent; decode() stays
# scalar only.
#
# O2 sensors: S1..S8 follow 0x13 (two banks) or 0x1D (four banks), whichever the ECU
# supports, in the bit order of that present-sensor byte (S1 = bit 0, S2 = bit 1, ...);
# this applies to 0x14-0x1B, 0x24-0x2B and 0x34-0x3B.
# MONITOR_STATUS byte B is split around its ignition-type bit (B bit 3) so that no bit is
# listed twice. 0x1C OBD_STANDARD and 0x51 FUEL_TYPE are raw bytes: the SAE J1979 tables
# are long and are not decoded here.
#
# `identification`: ISO 14229-1 Annex C identification DIDs read with 0x22, ASCII,
# variable length (no `length`). 0xF18C (ECU serial number) and 0xF190 (VIN) are
# deliberately absent: personal data (D-059 keeps only the VIN's WMI, D-033). The
# request [0x22, hi, lo] must pass tester_policy and the frame gate (codegen checks).
#
# Not here: 0x32 EVAP system vapor pressure (signed two's complement, which the scalar
# schema does not carry).

schema_version: 1
decision: D-066
reference: SAE J1979 / ISO 15031-5 mode 0x01 PIDs, over UDS 0x22 as DID 0xF400 | PID (ISO 14229-1)

# UI group and label of the polled DIDs (uds/vehicle_cl250.yaml), so the merged catalog
# carries them for every signal. Keys must match that file's DID names exactly.
polled:
  ENGINE_SPEED: {group: engine, label: Engine speed}
  VEHICLE_SPEED: {group: motion, label: Speed}
  THROTTLE_POS: {group: engine, label: Throttle}
  COOLANT_TEMP: {group: temperature, label: Coolant}
  BATTERY_VOLTAGE: {group: electrical, label: Battery}
  ENGINE_LOAD: {group: engine, label: Engine load}
  TIMING_ADVANCE: {group: engine, label: Ignition advance}
  ABSOLUTE_LOAD: {group: engine, label: Absolute load}
  RELATIVE_THROTTLE_POS: {group: engine, label: Relative throttle}
  ABSOLUTE_THROTTLE_POS_B: {group: engine, label: Throttle B}
  ACCEL_PEDAL_POS_D: {group: engine, label: Throttle grip D}
  COMMANDED_THROTTLE: {group: engine, label: Commanded throttle}
  RELATIVE_ACCEL_PEDAL_POS: {group: engine, label: Relative grip}
  INTAKE_MAP: {group: air, label: Intake MAP}
  MAF_RATE: {group: air, label: Air flow}
  COMMANDED_EQUIV_RATIO: {group: air, label: Commanded lambda}
  SHORT_TERM_FUEL_TRIM_B1: {group: fuel, label: Short fuel trim}
  INJECTION_TIMING: {group: fuel, label: Injection timing}
  ENGINE_FUEL_RATE: {group: fuel, label: Fuel rate}
  DEMAND_TORQUE_PCT: {group: torque, label: Demanded torque}
  ACTUAL_TORQUE_PCT: {group: torque, label: Actual torque}
  BAROMETRIC_PRESSURE: {group: air, label: Barometric}
  LONG_TERM_FUEL_TRIM_B1: {group: fuel, label: Long fuel trim}
  FUEL_PRESSURE: {group: fuel, label: Fuel pressure}
  FUEL_RAIL_PRESSURE_REL: {group: fuel, label: Rail pressure (rel)}
  FUEL_RAIL_PRESSURE_GAUGE: {group: fuel, label: Rail pressure}
  COMMANDED_EVAP_PURGE: {group: fuel, label: EVAP purge}
  FUEL_LEVEL: {group: fuel, label: Fuel level}
  ETHANOL_PERCENT: {group: fuel, label: Ethanol}
  INTAKE_AIR_TEMP: {group: temperature, label: Intake air}
  CATALYST_TEMP_B1S1: {group: temperature, label: Catalyst}
  AMBIENT_AIR_TEMP: {group: temperature, label: Ambient}
  ENGINE_OIL_TEMP: {group: temperature, label: Oil}
  RUN_TIME_SINCE_START: {group: engine, label: Run time}
  DISTANCE_WITH_MIL: {group: diagnostic, label: Distance with MIL}
  WARMUPS_SINCE_CLEAR: {group: diagnostic, label: Warm-ups since clear}
  DISTANCE_SINCE_CLEAR: {group: diagnostic, label: Distance since clear}
  TIME_WITH_MIL: {group: diagnostic, label: Time with MIL}
  TIME_SINCE_CLEAR: {group: diagnostic, label: Time since clear}
  REFERENCE_TORQUE: {group: torque, label: Reference torque}

groups: [engine, motion, air, fuel, temperature, electrical, torque, diagnostic]

candidates:
  - obd_pid: 0x01
    did: 0xF401
    name: MONITOR_STATUS
    label: Monitor status
    group: diagnostic
    length: 4
    description: "Monitor status since DTCs cleared (SAE J1979 PID 0x01): MIL, DTC count, ignition type and the readiness bytes B-D (raw, SAE J1979 table)."
    fields:
      - {name: MIL_ON, byte: 0, bit: 7, bits: 1, factor_num: 1, factor_den: 1, offset: 0, unit: "", min: 0, max: 1}
      - {name: DTC_COUNT, byte: 0, bit: 0, bits: 7, factor_num: 1, factor_den: 1, offset: 0, unit: "", min: 0, max: 127}
      - {name: READINESS_B_LOW, byte: 1, bit: 0, bits: 3, factor_num: 1, factor_den: 1, offset: 0, unit: "", min: 0, max: 7}
      - {name: IGNITION_TYPE, byte: 1, bit: 3, bits: 1, factor_num: 1, factor_den: 1, offset: 0, unit: "", min: 0, max: 1, enum: {0: SPARK, 1: COMPRESSION}}
      - {name: READINESS_B_HIGH, byte: 1, bit: 4, bits: 4, factor_num: 1, factor_den: 1, offset: 0, unit: "", min: 0, max: 15}
      - {name: READINESS_C, byte: 2, size: 1, factor_num: 1, factor_den: 1, offset: 0, unit: "", min: 0, max: 255}
      - {name: READINESS_D, byte: 3, size: 1, factor_num: 1, factor_den: 1, offset: 0, unit: "", min: 0, max: 255}

  - obd_pid: 0x03
    did: 0xF403
    name: FUEL_SYSTEM_STATUS
    label: Fuel system status
    group: fuel
    length: 2
    description: "Fuel system 1 and 2 status (SAE J1979 PID 0x03)."
    fields:
      - {name: FUEL_SYSTEM_1, byte: 0, size: 1, factor_num: 1, factor_den: 1, offset: 0, unit: "", min: 0, max: 255, enum: {0: NOT_REPORTED, 1: OPEN_LOOP_INSUFFICIENT_TEMP, 2: CLOSED_LOOP, 4: OPEN_LOOP_LOAD_OR_DECEL, 8: OPEN_LOOP_SYSTEM_FAILURE, 16: CLOSED_LOOP_FEEDBACK_FAULT}}
      - {name: FUEL_SYSTEM_2, byte: 1, size: 1, factor_num: 1, factor_den: 1, offset: 0, unit: "", min: 0, max: 255, enum: {0: NOT_REPORTED, 1: OPEN_LOOP_INSUFFICIENT_TEMP, 2: CLOSED_LOOP, 4: OPEN_LOOP_LOAD_OR_DECEL, 8: OPEN_LOOP_SYSTEM_FAILURE, 16: CLOSED_LOOP_FEEDBACK_FAULT}}

