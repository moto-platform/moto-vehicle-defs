# Honda CL250 vehicle constants used by the derived signals (D-070 item 3), so no node
# hard-codes a ratio or a dimension (invariant 2). rt-core gets them as
# gen/c/rt_core/vehicle_cl250_constants.h, the Python reference (moto-server) as
# moto_defs.vehicle_constants. Formulas never live here: they are logic, in rt-core's
# src/features/derived/ (and services/ for the gear estimate) and in the Python reference.
#
# status:
#   spec        manufacturer specification (docs/vehicle-work-plan.md section 2)
#   calculated  derived from spec values (formula in `source`)
#   provisional a generic or estimated value, to be replaced by a measurement
#   measured    measured on the bike (evidence in `source`)
# Changing a value is a /signal-change (CHANGELOG + version bump). Derived signals are
# QM information (D-070 item 5): none of these values feeds a safety decision.
#
# The derived signal definitions themselves go to derived/cl250_derived.yaml (D-070
# item 3, next /signal-change); ride-summary DIDs use the rt-core block 0xFD40-0xFD5F
# reserved in uds/dids.yaml (D-070 item 4).

schema_version: 1

