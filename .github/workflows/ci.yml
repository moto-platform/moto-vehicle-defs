name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: tools/codegen/uv.lock

      - name: Install codegen
        run: uv sync --locked --project tools/codegen

      - name: Strict DBC parse + consistency checks
        run: make parse

      - name: Lint
        run: make lint

      - name: Tests
        run: make test

      - name: Generated code is up to date
        run: make drift
