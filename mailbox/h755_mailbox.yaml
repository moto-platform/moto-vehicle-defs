# STM32H755 M7 <-> M4 inter-core mailbox layout (D-072 item 4c, D-093).
# The region, the slot order and one HSEM ID per slot live here. Each slot names a
# platform.dbc message: its CAN ID, length and E2E settings come from the DBC, never
# from this file. `vehicle-codegen check` verifies the slot set against the messages
# SAFETY receives and sends. Any change is a defs MINOR and needs safety-reviewer.

region:
  name: ipc_mailbox
  base_address: 0x38000000 # SRAM4 (D3 domain), reachable by both cores
  reserved_bytes: 256
  verified: false
  note: >-
    The address is confirmed with the CubeMX pin plan (roadmap S2) and the board;
    until then verified stays false.

slots:
  - {message: EkfLean, direction: m7_to_m4, class: safety, hsem_id: 1}
  - {message: EkfFrictionMass, direction: m7_to_m4, class: safety, hsem_id: 2}
  - {message: HeartbeatRtCore, direction: m7_to_m4, class: safety, hsem_id: 3}
  - {message: SafetyRequest, direction: m7_to_m4, class: qm, hsem_id: 4}
  - {message: SafetyWarningStatus, direction: m4_to_m7, class: safety, hsem_id: 5}
  - {message: HeartbeatSafety, direction: m4_to_m7, class: safety, hsem_id: 6}
