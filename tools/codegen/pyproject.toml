[project]
name = "vehicle-codegen"
version = "0.14.0"
description = "Code generator and consistency checks for vehicle-defs"
requires-python = ">=3.11"
dependencies = [
    "cantools>=44.1,<45",
    "pyyaml>=6.0",
    "vss-tools==6.0",
]

[project.scripts]
vehicle-codegen = "vehicle_codegen.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vehicle_codegen"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Embedded C templates keep C formatting.
"src/vehicle_codegen/gen_c.py" = ["E501"]
"src/vehicle_codegen/gen_uds.py" = ["E501"]
"src/vehicle_codegen/c_e2e_templates.py" = ["E501"]
