[project]
name = "moto-codegen"
version = "0.1.0"
description = "Generates node-filtered C, Python and VSS artifacts from moto-vehicle-defs sources"
requires-python = ">=3.11"
dependencies = [
    "cantools==44.1.0",
    "pyyaml>=6.0",
    "vss-tools==6.1.0",
]

[project.scripts]
moto-codegen = "moto_codegen.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moto_codegen"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# These modules embed C source text; line length follows the C code.
"src/moto_codegen/templates.py" = ["E501"]
"src/moto_codegen/gen_c.py" = ["E501"]
